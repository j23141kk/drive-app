<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Landscape Translation System</title>
        
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <style>
            :root {
                --bg-color: #f4f6f9;
                --card-bg: #ffffff;
                --text-main: #333333;
                --accent-color: #60c9ec;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background-color: var(--bg-color);
                color: var(--text-main);
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            /* スマホ向けのコンテナ */
            .phone-container {
                width: 100%;
                max-width: 414px; 
                height: 896px;
                background: var(--card-bg);
                box-shadow: 0 4px 24px rgba(0,0,0,0.1);
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                position: relative;
            }

            /* ヘッダー */
            header {
                background-color: var(--accent-color);
                color: white;
                padding: 16px;
                text-align: center;
                font-size: 1.1rem;
                font-weight: bold;
                position: sticky;
                top: 0;
                z-index: 1000;
            }

            /* メインコンテンツエリア */
            main {
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                flex: 1;
            }

            .card {
                background: #fff;
                border-radius: 12px;
                padding: 16px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.05);
                border: 1px solid #eee;
            }

            .card-title {
                font-size: 0.9rem;
                color: #666;
                margin-bottom: 8px;
                font-weight: bold;
            }

            /* マップ表示エリア */
            .map-area {
                height: 200px;
                background: #e5e5e5;
                border-radius: 8px;
                position: relative;
                overflow: hidden;
            }
            
            #map {
                width: 100%;
                height: 100%;
                z-index: 1;
            }

            /* 風景翻訳テキスト表示 */
            .translation-text {
                font-size: 1.1rem;
                line-height: 1.6;
                color: var(--text-main);
                min-height: 80px;
            }

            /* 座標表示デバッグ用 */
            .location-info {
                font-size: 0.8rem;
                color: #888;
                margin-bottom: 8px;
            }

            footer {
                padding: 12px;
                text-align: center;
                font-size: 0.8rem;
                color: #999;
                border-top: 1px solid #eee;
            }
        </style>
    </head>
    <body>

        <div class="phone-container">
            <header>
                Landscape Translation System
            </header>

            <main>
                <section class="card">
                    <div class="card-title">LIVE MAP</div>
                    <div class="map-area">
                        <div id="map"></div>
                    </div>
                </section>
                
                <section class="card">
                    <div class="card-title">LANDSCAPE TRANSLATION</div>
                    <div class="location-info" id="locationInfo">
                        📍 GPS測位中...
                    </div>
                    <div class="translation-text" id="translationText">
                        現在地を取得しています...
                    </div>
                </section>
            </main>

            <footer>
                J23141 Graduation Research Project
            </footer>
        </div>

        <script>
            let map;
            let currentMarker;
            let isMapInitialized = false;
            let lastLat = null;
            let lastLng = null;

            // 2点間の距離(メートル)を計算する関数
            function getDistance(lat1, lng1, lat2, lng2) {
                const R = 6371000;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLng = (lng2 - lng1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                        Math.sin(dLng / 2) * Math.sin(dLng / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            }

            // Python（FastAPI・RAG）からリアルタイム現在地の風景翻訳文を取得する処理
            async function fetchRAGTranslation(lat, lng) {
                const translationEl = document.getElementById('translationText');
                translationEl.textContent = "AIが現在地の風景を翻訳中...";

                try {
                    const response = await fetch("http://localhost:8000/api/translate-landscape", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            lat: lat,
                            lng: lng
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`APIエラー: ${response.status}`);
                    }

                    const data = await response.json();
                    // Pythonから届いたリアルタイムな風景翻訳を表示
                    translationEl.textContent = data.translation;

                } catch (error) {
                    console.error("API通信エラー:", error);
                    translationEl.textContent = "風景翻訳の取得に失敗しました。Pythonサーバーが起動しているか確認してください。";
                }
            }

            function updateLocation(position) {
                const currentLat = position.coords.latitude;
                const currentLng = position.coords.longitude;

                document.getElementById('locationInfo').textContent = 
                    `📍 現在地: 緯度 ${currentLat.toFixed(5)}, 経度 ${currentLng.toFixed(5)}`;

                if (!isMapInitialized) {
                    map = L.map('map').setView([currentLat, currentLng], 15);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(map);

                    currentMarker = L.marker([currentLat, currentLng]).addTo(map).bindPopup('現在地').openPopup();
                    isMapInitialized = true;

                    // 初回測位時に翻訳リクエストを送信
                    lastLat = currentLat;
                    lastLng = currentLng;
                    fetchRAGTranslation(currentLat, currentLng);
                } else {
                    map.setView([currentLat, currentLng]);
                    currentMarker.setLatLng([currentLat, currentLng]);

                    // 前回リクエストした位置から50m以上移動したら再取得（連続API呼び出し防止）
                    if (lastLat !== null && lastLng !== null) {
                        const distanceMoved = getDistance(lastLat, lastLng, currentLat, currentLng);
                        if (distanceMoved >= 50) {
                            lastLat = currentLat;
                            lastLng = currentLng;
                            fetchRAGTranslation(currentLat, currentLng);
                        }
                    }
                }
            }

            function handleError(error) {
                console.error("GPSエラー:", error);
                document.getElementById('translationText').textContent = "GPSの取得に失敗しました。位置情報の許可を確認してください。";
            }

            window.onload = function() {
                if (navigator.geolocation) {
                    navigator.geolocation.watchPosition(updateLocation, handleError, {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 10000
                    });
                } else {
                    alert("GPSに対応していません。");
                }
            };
        </script>
    </body>
</html>
