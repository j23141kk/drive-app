<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Landscape Translation System</title>
        
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <style>
            :root {
                --bg-color: #f4f6f9;
                --card-bg: #ffffff;
                --text-main: #333333;
                --accent-color: #60c9ec;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background-color: var(--bg-color);
                color: var(--text-main);
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            /* スマホ向けのコンテナ */
            .phone-container {
                width: 100%;
                max-width: 414px; 
                height: 896px;
                background: var(--card-bg);
                box-shadow: 0 4px 24px rgba(0,0,0,0.1);
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                position: relative;
            }

            /* ヘッダー */
            header {
                background-color: var(--accent-color);
                color: white;
                padding: 16px;
                text-align: center;
                font-size: 1.1rem;
                font-weight: bold;
                position: sticky;
                top: 0;
                z-index: 1000;
            }

            /* メインコンテンツエリア */
            main {
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                flex: 1;
            }

            .card {
                background: #fff;
                border-radius: 12px;
                padding: 16px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.05);
                border: 1px solid #eee;
            }

            .card-title {
                font-size: 0.9rem;
                color: #666;
                margin-bottom: 8px;
                font-weight: bold;
            }

            /* マップ表示エリア */
            .map-area {
                height: 200px;
                background: #e5e5e5;
                border-radius: 8px;
                position: relative;
                overflow: hidden;
            }
            
            #map {
                width: 100%;
                height: 100%;
                z-index: 1;
            }

            /* 周辺スポット用のカルーゼル設定 */
            .spots-carousel {
                display: flex;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                gap: 12px;
                padding: 4px 0;
                scrollbar-width: none;
            }
            .spots-carousel::-webkit-scrollbar {
                display: none;
            }

            /* スポットカードのデザイン */
            .spot-card {
                flex: 0 0 80%;
                scroll-snap-align: start;
                background-color: #fafbfc;
                border-radius: 8px;
                padding: 12px;
                border: 1px solid #eaedf1;
                transition: all 0.3s ease;
            }

            /* カテゴリバッジ */
            .spot-category {
                display: inline-block;
                font-size: 0.7rem;
                font-weight: bold;
                padding: 2px 6px;
                border-radius: 4px;
                margin-bottom: 6px;
            }
            .cat-歴史 { background: #efebe9; color: #5d4037; }
            .cat-自然 { background: #e8f5e9; color: #2e7d32; }
            .cat-景勝地 { background: #e3f2fd; color: #1565c0; }
            .cat-グルメ { background: #ffe7e0; color: #ef4000; }
            .cat-道の駅 { background: #f3e5f5; color: #7b1fa2; }
            .cat-施設 { background: #e0f7fa; color: #006064; }
            .cat-なし { background: #f5f5f5; color: #9e9e9e; }

            .spot-name {
                font-size: 0.95rem;
                font-weight: bold;
                color: #333;
                margin-bottom: 4px;
            }

            .spot-distance {
                font-size: 0.8rem;
                color: #888;
            }

            /* 風景翻訳テキスト表示 */
            .translation-text {
                font-size: 1.1rem;
                line-height: 1.6;
                color: var(--text-main);
                min-height: 80px;
            }

            footer {
                padding: 12px;
                text-align: center;
                font-size: 0.8rem;
                color: #999;
                border-top: 1px solid #eee;
            }
        </style>
    </head>
    <body>

        <div class="phone-container">
            <header>
                Landscape Translation System
            </header>

            <main>
                <section class="card">
                    <div class="card-title">LIVE MAP</div>
                    <div class="map-area">
                        <div id="map"></div>
                    </div>
                </section>
                
                <section class="card">
                    <div class="card-title">NEARBY SPOTS</div>
                    <div class="spots-carousel" id="spotsCarousel">
                    </div>
                </section>
                
                <section class="card">
                    <div class="card-title">LANDSCAPE TRANSLATION</div>
                    <div class="translation-text" id="translationText">
                        走行中...。歴史や文化のあるスポットに近づくと、ここに自動で『風景翻訳』のテキストが表示されます。
                    </div>
                </section>

            </main>

            <footer>
                J23141 Graduation Research Project
            </footer>
        </div>

        <script>
            let map;
            let currentMarker;
            let isMapInitialized = false;
            let lastTriggeredPoint = null;

            // 地点リスト（判定用の緯度・経度とスポット名のみ保持）
            const translationPoints = [
                {
                    name: "東京情報大学5号館",
                    lat: 35.6369279,
                    lng: 140.2020905,
                    radius: 100,
                    spots: [
                        { category: "施設", name: "情報大 5号館講義室", distance: "0m" },
                        { category: "グルメ", name: "学生食堂", distance: "120m" },
                        { category: "施設", name: "情報大 本部棟図書館", distance: "250m" }
                    ]
                },
                {
                    name: "自宅",
                    lat: 35.508572, 
                    lng: 140.071769, 
                    radius: 50,
                    spots: [
                        { category: "歴史", name: "姉崎二子塚古墳", distance: "4.7km" },
                        { category: "グルメ", name: "田中屋", distance: "1.7km" },
                        { category: "道の駅", name: "道の駅 あずの里・いちはら", distance: "7.6km" }
                    ]
                },
                {
                    name: "祖母家",
                    lat: 35.526003,
                    lng: 140.092018,   
                    radius: 100,
                    spots: [
                        { category: "景勝地", name: "ガス灯通りの洋館", distance: "80m" },
                        { category: "グルメ", name: "老舗の喫茶ブラン", distance: "150m" },
                        { category: "歴史", name: "近代建築記念碑", distance: "320m" }
                    ]
                }
            ];

            const defaultText = "走行中...。歴史や文化のあるスポットに近づくと、ここに自動で『風景翻訳』のテキストが表示されます。";
            const defaultSpots = [
                { category: "なし", name: "周辺情報はありません", distance: "- m" },
                { category: "なし", name: "周辺情報はありません", distance: "- m" },
                { category: "なし", name: "周辺情報はありません", distance: "- m" }
            ];

            function getDistance(lat1, lng1, lat2, lng2) {
                const R = 6371000;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLng = (lng2 - lng1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                        Math.sin(dLng / 2) * Math.sin(dLng / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            }

            function updateSpotsCarousel(spotsArray) {
                const carousel = document.getElementById('spotsCarousel');
                if (!carousel) return;

                let htmlContent = '';
                spotsArray.forEach(spot => {
                    htmlContent += `
                        <div class="spot-card" style="${spot.category === 'なし' ? 'opacity: 0.5;' : ''}">
                            <span class="spot-category cat-${spot.category}">${spot.category}</span>
                            <div class="spot-name">${spot.name}</div>
                            <div class="spot-distance">📍 ${spot.distance}</div>
                        </div>
                    `;
                });
                carousel.innerHTML = htmlContent;
            }

            // Python（FastAPI・RAG）から風景翻訳文を取得する処理
            async function fetchRAGTranslation(point) {
                const translationEl = document.getElementById('translationText');
                translationEl.textContent = `【${point.name}】に接近中。AIがRAG資料から風景を翻訳しています...`;

                try {
                    const response = await fetch("http://localhost:8000/api/translate-landscape", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            spot_name: point.name,
                            lat: point.lat,
                            lng: point.lng
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`APIエラー: ${response.status}`);
                    }

                    const data = await response.json();
                    // Pythonから届いたRAG翻訳テキストを表示
                    translationEl.textContent = data.translation;

                } catch (error) {
                    console.error("API通信エラー:", error);
                    translationEl.textContent = "風景翻訳の取得に失敗しました。Pythonサーバーが起動しているか確認してください。";
                }
            }

            function checkLocation(position) {
                const currentLat = position.coords.latitude;
                const currentLng = position.coords.longitude;

                if (!isMapInitialized) {
                    map = L.map('map').setView([currentLat, currentLng], 15);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(map);

                    currentMarker = L.marker([currentLat, currentLng]).addTo(map).bindPopup('現在地').openPopup();

                    translationPoints.forEach(point => {
                        L.circle([point.lat, point.lng], {
                            color: '#ff0000',
                            fillColor: '#ff0000',
                            fillOpacity: 0.2,
                            radius: point.radius
                        }).addTo(map).bindPopup(point.name);
                    });

                    isMapInitialized = true;
                } else {
                    map.setView([currentLat, currentLng]);
                    currentMarker.setLatLng([currentLat, currentLng]);
                }

                let matchedPoint = null;

                for (const point of translationPoints) {
                    const distance = getDistance(currentLat, currentLng, point.lat, point.lng);
                    if (distance <= point.radius) {
                        matchedPoint = point;
                        break;
                    }
                }

                if (matchedPoint) {
                    if (lastTriggeredPoint !== matchedPoint.name) {
                        lastTriggeredPoint = matchedPoint.name;
                        updateSpotsCarousel(matchedPoint.spots);
                        // Python APIを呼んでRAGで生成したテキストを反映
                        fetchRAGTranslation(matchedPoint);
                    }
                } else {
                    if (lastTriggeredPoint !== null) {
                        lastTriggeredPoint = null;
                        document.getElementById('translationText').textContent = defaultText;
                        updateSpotsCarousel(defaultSpots);
                    }
                }
            }

            function handleError(error) {
                console.error("GPSエラー:", error);
                document.getElementById('translationText').textContent = "GPSの取得に失敗しました。";
            }

            window.onload = function() {
                updateSpotsCarousel(defaultSpots);

                if (navigator.geolocation) {
                    navigator.geolocation.watchPosition(checkLocation, handleError, {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 5000
                    });
                } else {
                    alert("GPSに対応していません。");
                }
            };
        </script>
    </body>
</html>
