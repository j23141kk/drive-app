<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Landscape Translation System</title>
        <link rel="manifest" href="/manifest.webmanifest">
        <meta name="theme-color" content="#60c9ec">
        
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <style>
            :root {
                --bg-color: #f4f6f9;
                --card-bg: #ffffff;
                --text-main: #333333;
                --accent-color: #60c9ec;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background-color: var(--bg-color);
                color: var(--text-main);
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            /* スマホ向けのコンテナ */
            .phone-container {
                width: 100%;
                max-width: 414px; 
                height: 896px;
                background: var(--card-bg);
                box-shadow: 0 4px 24px rgba(0,0,0,0.1);
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                position: relative;
            }

            /* ヘッダー */
            header {
                background-color: var(--accent-color);
                color: white;
                padding: 16px;
                text-align: center;
                font-size: 1.1rem;
                font-weight: bold;
                position: sticky;
                top: 0;
                z-index: 1000;
            }

            /* メインコンテンツエリア */
            main {
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                flex: 1;
            }

            .card {
                background: #fff;
                border-radius: 12px;
                padding: 16px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.05);
                border: 1px solid #eee;
            }

            .card-title {
                font-size: 0.9rem;
                color: #666;
                margin-bottom: 8px;
                font-weight: bold;
            }

            /* マップ表示エリア */
            .map-area {
                height: 200px;
                background: #e5e5e5;
                border-radius: 8px;
                position: relative;
                overflow: hidden;
            }
            
            #map {
                width: 100%;
                height: 100%;
                z-index: 1;
            }

            .recenter-button {
                position: absolute;
                top: 10px;
                right: 10px;
                z-index: 1000;
                padding: 8px 12px;
                border: 1px solid #ccc;
                border-radius: 4px;
                background: #fff;
                color: #333;
                font: inherit;
                cursor: pointer;
            }

            /* 風景翻訳テキスト表示 */
            .translation-text {
                font-size: 1.1rem;
                line-height: 1.6;
                color: var(--text-main);
                min-height: 80px;
            }

            .speech-controls {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 10px;
            }

            .speech-controls button {
                padding: 8px 10px;
                border: 1px solid #ccc;
                border-radius: 6px;
                background: #fff;
                color: var(--text-main);
                font: inherit;
                cursor: pointer;
            }

            .speech-controls button:disabled {
                opacity: 0.5;
                cursor: default;
            }

            .speech-status {
                min-height: 1.4em;
                margin-top: 6px;
                color: #666;
                font-size: 0.85rem;
            }

            /* 座標表示デバッグ用 */
            .location-info {
                font-size: 0.8rem;
                color: #888;
                margin-bottom: 8px;
            }

            /* NEARBY SPOTS用のスタイル */
            .spot-list {
                list-style: none;
                font-size: 0.85rem;
            }

            .spot-item {
                padding: 6px 0;
                border-bottom: 1px solid #f0f0f0;
                display: flex;
                justify-content: space-between;
            }

            .spot-item:last-child {
                border-bottom: none;
            }

            .spot-category {
                color: #888;
                font-size: 0.75rem;
            }

            footer {
                padding: 12px;
                text-align: center;
                font-size: 0.8rem;
                color: #999;
                border-top: 1px solid #eee;
            }
        </style>
    </head>
    <body>

        <div class="phone-container">
            <header>
                Landscape Translation System
            </header>

            <main>
                <section class="card">
                    <div class="card-title">LIVE MAP</div>
                    <div class="map-area">
                        <div id="map"></div>
                        <button class="recenter-button" id="recenterButton" type="button" hidden>現在地へ戻る</button>
                    </div>
                </section>
                
                <section class="card">
                    <div class="card-title">LANDSCAPE TRANSLATION</div>
                    <div class="location-info" id="locationInfo">
                        📍 GPS測位中...
                    </div>
                    <div class="translation-text" id="translationText">
                        現在地を取得しています...
                    </div>
                    <div class="speech-controls" aria-label="音声読み上げ操作">
                        <button id="speechStartButton" type="button">🔊 読み上げ</button>
                        <button id="speechPauseButton" type="button" disabled>⏸ 一時停止</button>
                        <button id="speechResumeButton" type="button" disabled>▶ 再開</button>
                        <button id="speechStopButton" type="button" disabled>■ 停止</button>
                    </div>
                    <div class="speech-status" id="speechStatus" role="status" aria-live="polite"></div>
                </section>

                <section class="card">
                    <div class="card-title">NEARBY SPOTS</div>
                    <ul class="spot-list" id="spotList">
                        <li class="spot-item">周辺情報を検索中...</li>
                    </ul>
                </section>
            </main>

            <footer>
                J23141 Graduation Research Project
            </footer>
        </div>

        <script>
            let map;
            let currentMarker;
            let spotMarkers = [];
            let isMapInitialized = false;
            let watchId = null;
            let routeLine = null;
            let followCurrentLocation = true;
            let smoothedPosition = null;
            let lastAcceptedTimestamp = null;
            let lastLat = null;
            let lastLng = null;
            let translationRequestId = 0;
            let hasStartedTranslationRequest = false;
            let speechUtterance = null;
            let speechTextSnapshot = "";
            let speechIsAutomatic = false;
            let pendingAutoSpeechText = "";
            const autoSpokenTexts = new Set();
            let japaneseVoices = [];

            // 2点間の距離(メートル)を計算する関数
            function getDistance(lat1, lng1, lat2, lng2) {
                const R = 6371000;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLng = (lng2 - lng1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                        Math.sin(dLng / 2) * Math.sin(dLng / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            }

            function refreshJapaneseVoices() {
                if (!('speechSynthesis' in window)) return;
                japaneseVoices = window.speechSynthesis.getVoices()
                    .filter(voice => voice.lang && voice.lang.toLowerCase().startsWith('ja'));
            }

            function updateSpeechControls(state) {
                const startButton = document.getElementById('speechStartButton');
                const pauseButton = document.getElementById('speechPauseButton');
                const resumeButton = document.getElementById('speechResumeButton');
                const stopButton = document.getElementById('speechStopButton');
                const supported = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
                startButton.disabled = !supported || state === 'speaking' || state === 'paused';
                pauseButton.disabled = state !== 'speaking';
                resumeButton.disabled = state !== 'paused';
                stopButton.disabled = state !== 'speaking' && state !== 'paused';
            }

            function stopSpeech(message) {
                const utterance = speechUtterance;
                speechUtterance = null;
                speechIsAutomatic = false;
                pendingAutoSpeechText = "";
                if (utterance && 'speechSynthesis' in window) window.speechSynthesis.cancel();
                updateSpeechControls('idle');
                document.getElementById('speechStatus').textContent = message;
            }

            function speakText(text, automatic = false) {
                if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
                    document.getElementById('speechStatus').textContent = 'このブラウザは音声読み上げに対応していません。';
                    updateSpeechControls('idle');
                    return false;
                }
                if (!text) {
                    document.getElementById('speechStatus').textContent = '読み上げる文章がありません。';
                    return false;
                }

                refreshJapaneseVoices();
                if (japaneseVoices.length === 0) {
                    if (automatic) pendingAutoSpeechText = text;
                    document.getElementById('speechStatus').textContent = '日本語音声が利用できません。端末の音声・読み上げ設定を確認してください。';
                    return false;
                }

                speechTextSnapshot = text;
                speechIsAutomatic = automatic;
                const utterance = new SpeechSynthesisUtterance(speechTextSnapshot);
                utterance.lang = 'ja-JP';
                utterance.voice = japaneseVoices.find(voice => voice.default && voice.localService)
                    || japaneseVoices.find(voice => voice.localService)
                    || japaneseVoices.find(voice => voice.default)
                    || japaneseVoices[0];
                utterance.rate = 1;
                speechUtterance = utterance;
                updateSpeechControls('speaking');
                document.getElementById('speechStatus').textContent = '読み上げを開始しています…';

                utterance.onstart = () => {
                    if (speechUtterance !== utterance) return;
                    autoSpokenTexts.add(speechTextSnapshot);
                    updateSpeechControls('speaking');
                    document.getElementById('speechStatus').textContent = pendingAutoSpeechText
                        ? '読み上げ中です。終了後に最新の翻訳を読み上げます。'
                        : '読み上げ中です。';
                };
                utterance.onpause = () => {
                    if (speechUtterance !== utterance) return;
                    updateSpeechControls('paused');
                    document.getElementById('speechStatus').textContent = pendingAutoSpeechText
                        ? '一時停止中です。再開後、終了時に最新の翻訳を読み上げます。'
                        : '読み上げを一時停止しています。';
                };
                utterance.onresume = () => {
                    if (speechUtterance !== utterance) return;
                    updateSpeechControls('speaking');
                    document.getElementById('speechStatus').textContent = pendingAutoSpeechText
                        ? '読み上げ中です。終了後に最新の翻訳を読み上げます。'
                        : '読み上げ中です。';
                };
                utterance.onend = () => {
                    if (speechUtterance !== utterance) return;
                    autoSpokenTexts.add(speechTextSnapshot);
                    speechUtterance = null;
                    speechIsAutomatic = false;
                    updateSpeechControls('idle');
                    const nextText = pendingAutoSpeechText;
                    pendingAutoSpeechText = '';
                    if (nextText && nextText !== speechTextSnapshot && !autoSpokenTexts.has(nextText)) {
                        speakText(nextText, true);
                    } else {
                        document.getElementById('speechStatus').textContent = '読み上げが完了しました。';
                    }
                };
                utterance.onerror = event => {
                    if (speechUtterance !== utterance) return;
                    const failedText = speechTextSnapshot;
                    const wasAutomatic = speechIsAutomatic;
                    speechUtterance = null;
                    speechIsAutomatic = false;
                    if (wasAutomatic) pendingAutoSpeechText = failedText;
                    updateSpeechControls('idle');
                    const detail = event.error === 'not-allowed'
                        ? 'ブラウザが自動再生を許可しませんでした。読み上げボタンを押して再試行してください。'
                        : '端末の音声合成設定を確認してください。';
                    document.getElementById('speechStatus').textContent = `読み上げに失敗しました。${detail}`;
                };

                try {
                    window.speechSynthesis.speak(utterance);
                } catch (error) {
                    if (speechUtterance === utterance) speechUtterance = null;
                    speechIsAutomatic = false;
                    if (automatic) pendingAutoSpeechText = text;
                    updateSpeechControls('idle');
                    document.getElementById('speechStatus').textContent = '読み上げを開始できませんでした。もう一度お試しください。';
                    console.error('音声読み上げエラー:', error);
                    return false;
                }
                return true;
            }

            function startSpeech() {
                if (speechUtterance) return;
                pendingAutoSpeechText = '';
                const text = document.getElementById('translationText').textContent.trim();
                speakText(text, false);
            }

            function queueAutomaticSpeech(text) {
                const latestText = typeof text === 'string' ? text.trim() : '';
                if (!latestText) return;

                // Do not replay text already being spoken, queued, or completed.
                if (speechUtterance && speechTextSnapshot === latestText) {
                    pendingAutoSpeechText = '';
                    return;
                }
                if (autoSpokenTexts.has(latestText)) {
                    pendingAutoSpeechText = '';
                    return;
                }
                if (pendingAutoSpeechText === latestText) return;

                pendingAutoSpeechText = latestText;
                if (speechUtterance) {
                    document.getElementById('speechStatus').textContent = '読み上げ中です。終了後に最新の翻訳を読み上げます。';
                    return;
                }
                pendingAutoSpeechText = '';
                speakText(latestText, true);
            }

            function initializeSpeechControls() {
                if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
                    document.getElementById('speechStatus').textContent = 'このブラウザは音声読み上げに対応していません。';
                    updateSpeechControls('idle');
                    return;
                }

                refreshJapaneseVoices();
                window.speechSynthesis.onvoiceschanged = () => {
                    refreshJapaneseVoices();
                    if (!speechUtterance && pendingAutoSpeechText && japaneseVoices.length > 0) {
                        const latestText = pendingAutoSpeechText;
                        pendingAutoSpeechText = '';
                        speakText(latestText, true);
                    }
                };
                document.getElementById('speechStartButton').addEventListener('click', startSpeech);
                document.getElementById('speechPauseButton').addEventListener('click', () => {
                    if (speechUtterance && window.speechSynthesis.speaking) window.speechSynthesis.pause();
                });
                document.getElementById('speechResumeButton').addEventListener('click', () => {
                    if (speechUtterance && window.speechSynthesis.paused) window.speechSynthesis.resume();
                });
                document.getElementById('speechStopButton').addEventListener('click', () => stopSpeech('読み上げを停止しました。'));
                updateSpeechControls('idle');

                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden' && speechUtterance) {
                        stopSpeech('画面を切り替えたため読み上げを停止しました。');
                    }
                });
                window.addEventListener('pagehide', () => {
                    if (speechUtterance) stopSpeech('画面を切り替えたため読み上げを停止しました。');
                });
            }

            // Python（FastAPI・RAG）からリアルタイム現在地の風景翻訳文を取得する処理
            async function fetchRAGTranslation(lat, lng, locationCapturedAt = performance.now(), requestId = null, requestKind = null) {
                const isNewRequest = requestId === null;
                const activeRequestId = isNewRequest ? ++translationRequestId : requestId;
                if (isNewRequest) {
                    requestKind = hasStartedTranslationRequest ? "update" : "initial";
                    hasStartedTranslationRequest = true;
                }
                if (activeRequestId !== translationRequestId) return;
                const searchStartedAt = performance.now();
                console.info("LANDSCAPE_TIMING", JSON.stringify({
                    phase: "search_started",
                    kind: requestKind,
                    location_to_search_ms: Math.round(searchStartedAt - locationCapturedAt)
                }));
                const translationEl = document.getElementById('translationText');
                const spotListEl = document.getElementById('spotList');
                
                translationEl.textContent = "AIが現在地の風景を翻訳中...";
                if (spotListEl) spotListEl.innerHTML = '<li class="spot-item">周辺情報を検索中...</li>';

                try {
                    const response = await fetch("/api/translate-landscape", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            lat: lat,
                            lng: lng
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        const apiError = new Error(errorData.detail || `APIエラー: ${response.status}`);
                        apiError.status = response.status;
                        throw apiError;
                    }

                    const data = await response.json();
                    const resultRetrievedAt = performance.now();
                    if (activeRequestId !== translationRequestId) return;
                    
                    // 風景翻訳文を表示
                    translationEl.textContent = data.translation;
                    const displayedAt = performance.now();
                    console.info("LANDSCAPE_TIMING", JSON.stringify({
                        phase: "displayed",
                        kind: requestKind,
                        location_to_search_ms: Math.round(searchStartedAt - locationCapturedAt),
                        search_to_result_ms: Math.round(resultRetrievedAt - searchStartedAt),
                        result_to_display_ms: Math.round(displayedAt - resultRetrievedAt),
                        location_to_display_ms: Math.round(displayedAt - locationCapturedAt)
                    }));

                    // RAGから取得した周辺スポットの表示処理
                    if (spotListEl) {
                        spotListEl.innerHTML = "";
                        
                        // 既存のマップピンを削除
                        spotMarkers.forEach(m => map.removeLayer(m));
                        spotMarkers = [];

                        if (data.nearby_spots && data.nearby_spots.length > 0) {
                            data.nearby_spots.forEach(spot => {
                                const li = document.createElement('li');
                                li.className = 'spot-item';
                                li.innerHTML = `<span>📍 ${spot.name}</span><span class="spot-category">${spot.category}</span>`;
                                spotListEl.appendChild(li);

                                // 座標が含まれている場合のみ地図上にピンを立てる
                                if (spot.lat && spot.lng) {
                                    const marker = L.marker([spot.lat, spot.lng])
                                        .addTo(map)
                                        .bindPopup(`<b>${spot.name}</b><br>${spot.category}`);
                                    spotMarkers.push(marker);
                                }
                            });
                        } else {
                            spotListEl.innerHTML = '<li class="spot-item">資料内に近くの関連スポットは見つかりませんでした。</li>';
                        }
                    }
                    queueAutomaticSpeech(data.translation);

                } catch (error) {
                    if (activeRequestId !== translationRequestId) return;
                    console.error("API通信エラー:", error);
                    translationEl.textContent = error.message || "風景翻訳の取得に失敗しました。Pythonサーバーが起動しているか確認してください。";
                    if (error.status === 503 && error.message.startsWith("資料を読み込んでいます。")) {
                        setTimeout(() => fetchRAGTranslation(lat, lng, locationCapturedAt, activeRequestId, requestKind), 3000);
                    }
                }
            }

            function updateLocation(position) {
                const locationCapturedAt = performance.now();
                const accuracy = position.coords.accuracy || 0;
                const candidate = { lat: position.coords.latitude, lng: position.coords.longitude };
                const timestamp = position.timestamp || Date.now();

                document.getElementById('locationInfo').textContent =
                    `📍 GPS取得成功 (精度 約${Math.round(accuracy)}m)`;

                // 精度が著しく低い測位や、時間・精度から見て非現実的な飛びを除外
                if (isMapInitialized && accuracy > 100) {
                    document.getElementById('locationInfo').textContent =
                        `📍 GPS精度が低いため待機中 (約${Math.round(accuracy)}m)`;
                    return;
                }
                if (smoothedPosition && lastAcceptedTimestamp !== null) {
                    const elapsedSeconds = Math.max(1, (timestamp - lastAcceptedTimestamp) / 1000);
                    const jump = getDistance(smoothedPosition.lat, smoothedPosition.lng, candidate.lat, candidate.lng);
                    const plausibleDistance = Math.max(100, elapsedSeconds * 45 + accuracy * 2);
                    if (jump > plausibleDistance) {
                        document.getElementById('locationInfo').textContent = '📍 GPS位置の大きな変動を除外しました';
                        return;
                    }
                    // 測位精度に応じて位置をなめらかに更新
                    const alpha = Math.min(0.85, Math.max(0.2, 25 / Math.max(25, accuracy)));
                    smoothedPosition = {
                        lat: smoothedPosition.lat + (candidate.lat - smoothedPosition.lat) * alpha,
                        lng: smoothedPosition.lng + (candidate.lng - smoothedPosition.lng) * alpha
                    };
                } else {
                    smoothedPosition = candidate;
                }
                lastAcceptedTimestamp = timestamp;
                const currentLat = smoothedPosition.lat;
                const currentLng = smoothedPosition.lng;

                document.getElementById('locationInfo').textContent =
                    `📍 現在地: 緯度 ${currentLat.toFixed(5)}, 経度 ${currentLng.toFixed(5)} (精度 約${Math.round(accuracy)}m)`;

                if (!isMapInitialized) {
                    map = L.map('map').setView([currentLat, currentLng], 15);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(map);

                    currentMarker = L.marker([currentLat, currentLng]).addTo(map).bindPopup('現在地').openPopup();
                    routeLine = L.polyline([[currentLat, currentLng]], { color: '#3388ff', weight: 4, opacity: 0.75 }).addTo(map);
                    isMapInitialized = true;
                    map.on('dragstart', () => {
                        followCurrentLocation = false;
                        document.getElementById('recenterButton').hidden = false;
                    });
                    document.getElementById('recenterButton').addEventListener('click', () => {
                        followCurrentLocation = true;
                        document.getElementById('recenterButton').hidden = true;
                        map.panTo([smoothedPosition.lat, smoothedPosition.lng], { animate: true, duration: 0.35 });
                    });

                    // 初回測位時に翻訳リクエストを送信
                    lastLat = currentLat;
                    lastLng = currentLng;
                    fetchRAGTranslation(currentLat, currentLng, locationCapturedAt);
                } else {
                    currentMarker.setLatLng([currentLat, currentLng]);
                    const routePoints = routeLine.getLatLngs();
                    const lastPoint = routePoints[routePoints.length - 1];
                    if (getDistance(lastPoint.lat, lastPoint.lng, currentLat, currentLng) >= Math.max(5, accuracy * 0.15)) {
                        routePoints.push([currentLat, currentLng]);
                        routeLine.setLatLngs(routePoints);
                    }
                    if (followCurrentLocation) {
                        map.panTo([currentLat, currentLng], { animate: true, duration: 0.35 });
                    }

                    // 前回リクエストした位置から80m以上移動したら再取得
                    if (lastLat !== null && lastLng !== null) {
                        const distanceMoved = getDistance(lastLat, lastLng, currentLat, currentLng);
                        if (distanceMoved >= 80) {
                            lastLat = currentLat;
                            lastLng = currentLng;
                            fetchRAGTranslation(currentLat, currentLng, locationCapturedAt);
                        }
                    }
                }
            }

            function handleError(error) {
                console.error("GPSエラー:", error);
                const status = error.code === 1 ? "位置情報の許可がありません。ブラウザ設定で許可してください。"
                    : error.code === 2 ? "現在地を取得できません。端末の位置情報設定を確認してください。"
                    : "位置情報の取得がタイムアウトしました。屋外などで再試行してください。";
                document.getElementById('locationInfo').textContent = `📍 ${status}`;
                document.getElementById('translationText').textContent = "GPSの取得に失敗しました。位置情報の許可を確認してください。";
            }

            window.onload = function() {
                initializeSpeechControls();
                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(updateLocation, handleError, {
                        enableHighAccuracy: true,
                        maximumAge: 3000,
                        timeout: 20000
                    });
                } else {
                    document.getElementById('locationInfo').textContent = '📍 このブラウザは位置情報に対応していません。';
                    document.getElementById('translationText').textContent = '位置情報を利用できません。';
                }
            };

            window.addEventListener('beforeunload', () => {
                if (watchId !== null && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
            });
        </script>
    </body>
</html>
