services:
  - type: web
    name: landscape-translation-system
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: RAG_DATA_DIR
        value: /app/rag_files
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
